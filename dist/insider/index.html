<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insider Login — StillCraft Events</title>
<style>
  :root { --bg: #111110; --card: #1c1c1a; --lime: #e0ff98; --txt: #f3efeb; --mut: #9a978f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--txt); font-family: Georgia, 'Times New Roman', serif;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: var(--card); border: 1px solid #2c2c2a; border-radius: 18px;
          padding: 44px 40px; width: 100%; max-width: 400px; }
  .brand { font-size: 13px; letter-spacing: 3px; color: var(--lime); margin-bottom: 8px; }
  h1 { font-size: 34px; font-weight: 400; margin-bottom: 6px; }
  p.sub { color: var(--mut); font-size: 14px; margin-bottom: 28px; font-family: Arial, sans-serif; }
  label { display: block; font-family: Arial, sans-serif; font-size: 12px; letter-spacing: 1px;
          color: var(--mut); margin: 16px 0 6px; }
  input { width: 100%; background: #111110; border: 1px solid #3a3a38; color: var(--txt);
          border-radius: 10px; padding: 12px 14px; font-size: 15px; outline: none; }
  input:focus { border-color: var(--lime); }
  button { width: 100%; margin-top: 26px; background: var(--lime); color: #111110; border: 0;
           border-radius: 999px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer;
           font-family: Arial, sans-serif; }
  button:disabled { opacity: .5; cursor: wait; }
  .err { display: none; margin-top: 14px; color: #ff9d9d; font-family: Arial, sans-serif; font-size: 13px; }
  .back { display: block; margin-top: 22px; text-align: center; color: var(--mut);
          font-family: Arial, sans-serif; font-size: 13px; text-decoration: none; }
</style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="off">
    <div class="brand">STILLCRAFT EVENTS</div>
    <h1>Insider login</h1>
    <p class="sub">Restricted area. Admins only.</p>
    <label for="email">EMAIL</label>
    <input id="email" type="email" required placeholder="admin@stillcraft.events">
    <label for="password">PASSWORD</label>
    <input id="password" type="password" required placeholder="••••••••••">
    <div class="err" id="err">Invalid email or password.</div>
    <button type="submit" id="btn">Log in</button>
    <a class="back" href="/">← Back to site</a>
  </form>
  <script>
    (function () {
      var form = document.getElementById('loginForm');
      var err = document.getElementById('err');
      var btn = document.getElementById('btn');
      fetch('/api/me').then(function (r) { return r.json(); }).then(function (d) {
        if (d && d.email) window.location.href = '/';
      }).catch(function () {});
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        err.style.display = 'none';
        btn.disabled = true;
        fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        }).then(function (r) {
          if (!r.ok) throw new Error('auth');
          window.location.href = '/';
        }).catch(function () {
          err.style.display = 'block';
          btn.disabled = false;
        });
      });
    })();
  </script>
</body>
</html>
